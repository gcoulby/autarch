services:
  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    ports:
      - '7474:7474'  # HTTP browser
      - '7687:7687'  # Bolt
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD', 'neo4j', 'status']
      interval: 10s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'  # REST
      - '6334:6334'  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6333/healthz']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  neo4j-data:
  qdrant-data:
