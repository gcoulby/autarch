services:

  # ── Databases ──────────────────────────────────────────────────────────────

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    ports:
      - '7474:7474'  # HTTP browser
      - '7687:7687'  # Bolt
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD', 'neo4j', 'status']
      interval: 10s
      timeout: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'  # REST
      - '6334:6334'  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6333/healthz']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── LLM ───────────────────────────────────────────────────────────────────
  #
  # Ollama exposes its API at port 11434. Docker Desktop forwards this to
  # localhost:11434 on the host machine. NEXT_PUBLIC_LLM_URL must use
  # localhost (not the internal "ollama" hostname) because LLM requests are
  # made by the browser, not by the Next.js server.
  #
  # GPU acceleration (NVIDIA): uncomment the `deploy` block below.

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 10s
      retries: 12
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Pull the default model once Ollama is healthy.
  # Change OLLAMA_MODEL in your .env file to use a different model.
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c', 'ollama pull ${OLLAMA_MODEL:-mistral}']
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  # ── Web app ───────────────────────────────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_LLM_URL: http://localhost:11434/v1
        NEXT_PUBLIC_LLM_MODEL: ${OLLAMA_MODEL:-mistral}
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_LLM_URL=http://localhost:11434/v1
      - NEXT_PUBLIC_LLM_MODEL=${OLLAMA_MODEL:-mistral}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  neo4j-data:
  qdrant-data:
  ollama-models:
